<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · LATIF LPG AGENCY</title><link rel="stylesheet" href="auth.css"><script defer src="auth.js"></script></head><body><main class="auth-card"><img src="latif-logo.png" alt="Latif LPG Agency logo"><h1>LATIF LPG AGENCY</h1><p id="auth-description">Private business workspace</p><form id="auth-form"><label id="setup-code-label" hidden>One-time setup code<input name="code" autocomplete="off"></label><label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="64"></label><label>Password<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256"></label><label id="confirm-password-label" hidden>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password"></label><button type="submit" id="auth-submit">Sign in</button><p id="auth-error" role="alert"></p></form><p class="auth-note" id="auth-note">Only the owner account can access this workspace.</p></main></body></html>
